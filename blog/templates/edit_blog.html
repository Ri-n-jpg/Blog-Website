<!DOCTYPE html>
<html>
<head>
    <title>Edit Blog</title>
</head>

<body>

<h2>Edit Blog</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="title" value="{{ blog.title }}"><br><br>

    <textarea name="blog_body" rows="10">{{ blog.blog_body }}</textarea><br><br>

    <button type="submit">Update</button>

</form>

</body>
</html>
