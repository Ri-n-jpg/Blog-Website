{% extends 'base.html' %}

{% block content %}

<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">✍️ Create New Blog</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Title -->
            <div class="mb-3">
                <label class="form-label">Blog Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <!-- Category -->
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-control">
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.category_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Image -->
            <div class="mb-3">
                <label class="form-label">Featured Image</label>
                <input type="file" name="featured_image" class="form-control" required>
            </div>

            <!-- Short Description -->
            <div class="mb-3">
                <label class="form-label">Short Description</label>
                <textarea name="short_description" class="form-control" rows="2"></textarea>
            </div>

            <!-- Blog Content -->
            <div class="mb-3">
                <label class="form-label">Blog Content</label>
                <textarea name="blog_body" class="form-control" rows="6"></textarea>
            </div>

            <!-- Status -->
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-control">
                    <option value="Draft">Draft</option>
                    <option value="Published">Published</option>
                </select>
            </div>

            <!-- Submit -->
            <div class="text-center">
                <button type="submit" class="btn btn-success px-4">Create Blog</button>
            </div>

        </form>
    </div>
</div>

{% endblock %}
