{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial;
        }
        .hero {
            background: linear-gradient(to right, #a18cd1, #fbc2eb);
            padding: 60px;
            color: white;
        }
        .card img {
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>

<body>

<!-- 🔷 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">BLOG</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

        <!-- LEFT SIDE -->
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'home' %}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'about' %}">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'contact' %}">Contact</a>
            </li>
        </ul>

        <!-- RIGHT SIDE -->
        <div>
            <a href="#" class="btn btn-outline-dark">Login</a>
        </div>

    </div>
</nav>

<!-- 🔷 HERO SECTION -->
<!-- 🔷 HERO SECTION (UPDATED) -->
<div class="hero container-fluid">
    <div class="row align-items-center">

        <!-- LEFT TEXT -->
        <div class="col-md-6 px-5">
            <h1 style="font-size:60px; font-weight:700; color:#4b2e83;">
                NEW ERA <br> BLOGGING
            </h1>
            <p style="font-size:18px; color:#555;">
                Share your thoughts and stories with the world.
            </p>
            <a href="#" class="btn btn-warning mt-3 px-4 py-2">
                Explore Blogs
            </a>
        </div>

        <!-- RIGHT IMAGE -->
        <div class="col-md-6 text-center">
            <img src="{% static 'images/girl.jpg' %}" class="img-fluid rounded-circle" style="max-width:350px;">
        </div>

    </div>
</div>
<!-- 🔷 BLOG SECTION -->
<div class="container mt-5">
    <h3>Latest Blogs</h3>
    <div class="row">

        {% for blog in blogs %}
        <div class="col-md-4 mt-3">
            <div class="card shadow">
                <img src="{{ blog.featured_image.url }}" class="card-img-top">
                <div class="card-body">
                    <h5>{{ blog.title }}</h5>
                    <p>{{ blog.short_description|truncatewords:15 }}</p>
                    <a href="#" class="btn btn-primary">Read More</a>
                </div>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

</body>
</html>
